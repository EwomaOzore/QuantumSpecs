services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantumspecs
      POSTGRES_PASSWORD: quantumspecs
      POSTGRES_DB: quantumspecs
    ports:
      - "5432:5432"
    volumes:
      - qs_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumspecs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qs_pg:
