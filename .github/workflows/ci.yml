name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantumspecs
          POSTGRES_PASSWORD: quantumspecs
          POSTGRES_DB: quantumspecs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantumspecs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://quantumspecs:quantumspecs@localhost:5432/quantumspecs
      DIRECT_URL: postgresql://quantumspecs:quantumspecs@localhost:5432/quantumspecs
      AUTH_SECRET: ci-quantumspecs-auth-secret
      CONSOLE_PASSWORD: kora-ops
      NEXT_PUBLIC_TENANT_NAME: Kora
      NEXT_PUBLIC_OPERATOR_NAME: Ewoma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
